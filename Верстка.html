<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UltimaThule Clan Buffs</title>
  <style>
    :root {
      --bg-color: #0b0612;
      --wrapper-bg: #120b1e;
      --card-bg: #1a102b;
      --card-inner: #140c21;
      --border-dim: #362259;
      --neon-purple: #b829ea;
      --neon-glow: rgba(184, 41, 234, 0.35);
      --accent: #d946ef;
      --caps-color: #fbbf24;
      --text-main: #f3e8ff;
      --text-muted: #a78bfa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .calculator-wrapper {
      width: 100%;
      max-width: 680px;
      background: var(--wrapper-bg);
      border: 2px solid var(--neon-purple);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 0 24px var(--neon-glow), inset 0 0 12px rgba(184, 41, 234, 0.15);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-dim);
    }

    .header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #ffffff;
    }

    .controls { display: flex; gap: 8px; flex-shrink: 0; }

    .btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-dim);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: var(--neon-purple);
      box-shadow: 0 0 10px var(--neon-glow);
      color: #ffffff;
    }

    .buffs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      .calculator-wrapper { padding: 14px; }
      .header {
        flex-direction: column;
        align-items: stretch;
        text-align: center;
        gap: 10px;
      }
      .header h1 { font-size: 1.02rem; }
      .controls { width: 100%; }
      .controls .btn {
        flex: 1;
        padding: 9px 10px;
        font-size: 0.82rem;
      }
      .buffs-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .result-total-prices,
      .member-result-prices {
        margin-left: auto;
        justify-content: flex-end;
      }
      .member-input {
        width: 90px;
        padding: 7px 8px;
      }
    }

    .buff-card {
      position: relative;
      background: var(--card-inner);
      border: 2px solid var(--border-dim);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 512 / 720;
      transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      user-select: none;
    }

    .buff-card:hover {
      transform: translateY(-2px);
      border-color: #6b21a8;
    }

    .buff-card.active {
      border-color: var(--neon-purple);
      box-shadow: 0 0 18px var(--neon-glow);
    }

    .buff-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.85);
      transition: filter 0.2s ease;
    }

    .buff-card.active img, .buff-card:hover img { filter: brightness(1); }

    .status-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(18, 11, 30, 0.88);
      border: 2px solid #581c87;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: transparent;
      transition: all 0.2s ease;
    }

    .buff-card.active .status-badge {
      background: var(--neon-purple);
      border-color: #e879f9;
      color: #ffffff;
      box-shadow: 0 0 8px var(--neon-purple);
    }

    .clan-rank-wrapper { position: relative; user-select: none; }

    .clan-rank-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .clan-rank-panel:hover { border-color: #6b21a8; }

    .clan-rank-panel.open {
      border-color: var(--neon-purple);
      box-shadow: 0 0 14px var(--neon-glow);
    }

    .panel-header {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .panel-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .selected-rank-display {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      min-height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dropdown-arrow {
      position: absolute;
      right: 4px;
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: transform 0.2s ease;
    }

    .clan-rank-panel.open .dropdown-arrow { transform: rotate(180deg); color: var(--accent); }
    .rank-warning {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #f87171;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      display: none;
    }

    .rank-warning.visible { display: block; }

    @keyframes dropdownFadeDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes dropdownFadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .rank-dropdown {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      bottom: auto;
      background: #1a102b;
      border: 1px solid var(--neon-purple);
      border-radius: 12px;
      max-height: min(260px, 45vh);
      overflow-y: auto;
      overscroll-behavior: contain;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.85), 0 0 16px var(--neon-glow);
      z-index: 20;
      display: none;
    }

    .rank-dropdown.open {
      display: block;
      animation: dropdownFadeDown 0.16s ease-out;
    }

    .rank-dropdown.open-up {
      top: auto;
      bottom: calc(100% + 8px);
      box-shadow: 0 -12px 28px rgba(0, 0, 0, 0.85), 0 0 16px var(--neon-glow);
    }

    .rank-dropdown.open.open-up {
      animation: dropdownFadeUp 0.16s ease-out;
    }

    .rank-dropdown::-webkit-scrollbar { width: 6px; }
    .rank-dropdown::-webkit-scrollbar-track { background: #120b1e; border-radius: 0 12px 12px 0; }
    .rank-dropdown::-webkit-scrollbar-thumb { background: #581c87; border-radius: 6px; }
    .rank-dropdown::-webkit-scrollbar-thumb:hover { background: var(--neon-purple); }

    .rank-option {
      padding: 10px 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 1px solid var(--border-dim);
      transition: background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .rank-option:last-child { border-bottom: none; }
    .rank-option:hover { background: #281842; }
    .rank-option.selected { background: rgba(184, 41, 234, 0.22); }

    .star-bronze { color: #cd7f32; font-size: 1.2rem; letter-spacing: 2px; padding-left: 2px; }
    .star-silver { color: #cbd5e1; font-size: 1.2rem; letter-spacing: 2px; padding-left: 2px; }
    .star-gold { color: #fbbf24; font-size: 1.2rem; letter-spacing: 2px; padding-left: 2px; }
    .star-diamond { color: #c084fc; font-size: 1.2rem; letter-spacing: 2px; padding-left: 2px; text-shadow: 0 0 8px rgba(192, 132, 252, 0.6); }

    .result-box {
      margin-top: 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-dim);
      border-radius: 12px;
      padding: 16px;
      display: none;
    }

    .result-box.visible { display: block; }
    .result-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .result-list.single-item { margin-bottom: 0; }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      background: var(--card-inner);
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-dim);
      font-size: 0.9rem;
    }

    .result-item-name { color: var(--text-main); font-weight: 500; }
    .result-item-prices { display: flex; align-items: center; gap: 10px; text-align: right; }
    .cost-tokens { font-weight: 700; color: #e879f9; }

    .cost-caps {
      font-weight: 700;
      color: var(--caps-color);
      font-size: 0.85rem;
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid rgba(251, 191, 36, 0.3);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .cost-unknown { font-weight: 700; color: #f87171; }

    .result-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border-dim);
      font-size: 1.05rem;
      font-weight: 700;
    }

    .result-total-prices { display: flex; align-items: center; gap: 12px; }
    .total-tokens { font-size: 1.2rem; color: #e879f9; }

    .total-caps {
      font-size: 1.1rem;
      color: var(--caps-color);
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.4);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .member-split-box {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border-dim);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .member-input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card-inner);
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-dim);
    }

    .member-input-label { font-size: 0.9rem; color: var(--text-main); font-weight: 500; }

    .member-input {
      width: 110px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-dim);
      background: var(--card-bg);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .member-input:focus {
      border-color: var(--neon-purple);
      box-shadow: 0 0 10px var(--neon-glow);
    }

    .member-input::placeholder { color: #7e5bef; font-weight: 400; }

    .member-result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 2px;
    }

    .member-result-label { font-size: 0.95rem; color: var(--text-muted); font-weight: 600; }
    .member-result-prices { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .member-tokens-value {
      font-size: 0.95rem;
      font-weight: 700;
      color: #e879f9;
    }

    .member-caps-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--caps-color);
      background: rgba(251, 191, 36, 0.14);
      border: 1px solid rgba(251, 191, 36, 0.4);
      padding: 4px 12px;
      border-radius: 8px;
    }

    .member-caps-value.empty {
      color: var(--text-muted);
      background: var(--card-inner);
      border-color: var(--border-dim);
    }

    .footer-credits {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--border-dim);
      text-align: center;
      font-size: 0.82rem;
      font-weight: 400;
      color: #9ca3af;
      line-height: 1.55;
    }

    .credit-clan { color: #facc15; font-weight: 700; }
    .credit-project { color: #4ade80; font-weight: 700; }
  </style>
</head>
<body>

<div class="calculator-wrapper">
  <div class="header">
    <h1>Калькулятор Клановых бафов 📜</h1>
    <div class="controls">
      <button class="btn" onclick="selectAllBuffs()">Выбрать все бафы.</button>
      <button class="btn" onclick="resetBuffs()">Сбросить.</button>
    </div>
  </div>

  <div class="buffs-grid" id="buffsGrid"></div>

  <div class="clan-rank-wrapper" id="clanRankWrapper">
    <div class="rank-dropdown" id="rankDropdown"></div>
    <div class="clan-rank-panel" id="clanRankPanel" onclick="toggleRankMenu(event)">
      <div class="panel-header">
        <div>
          <div class="panel-title">Ранг Клана:</div>
          <div class="selected-rank-display" id="selectedRankDisplay" style="color: var(--text-muted); font-weight: 500;">Выбери ранг.</div>
        </div>
        <div class="dropdown-arrow">▼</div>
      </div>
      <div class="rank-warning" id="rankWarning">Информация не подтверждена.</div>
    </div>
  </div>

  <div class="result-box" id="resultBox">
    <div class="panel-title">Стоимость выбранных бафов:</div>
    <div class="result-list" id="resultList"></div>
    <div class="result-total" id="resultTotalBlock">
      <span>Итоговая стоимость:</span>
      <div class="result-total-prices" id="resultTotalPrices"></div>
    </div>

    <div class="member-split-box" id="memberSplitBox">
      <div class="member-input-row">
        <label class="member-input-label" for="memberCountInput">Количество меценатов:</label>
        <input
          type="text"
          id="memberCountInput"
          class="member-input"
          inputmode="numeric"
          maxlength="3"
          placeholder="🤔"
          onfocus="scrollToMemberSplit()"
          oninput="this.value = this.value.replace(/^0+|[^0-9]/g, ''); updateCalculation();"
        />
      </div>
      <div class="member-result-row">
        <span class="member-result-label">Вклад с одного участника:</span>
        <div class="member-result-prices" id="memberResultPrices">
          <span class="member-caps-value empty">—</span>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-credits">
    <div>Создано кланом: <span class="credit-clan">Ultima Thule</span> © 2026г.</div>
    <div>Для проекта: <span class="credit-project">Dead Impact</span> 🧟</div>
  </div>
</div>

<script>
  const CAPS_PER_TOKEN = 5000;

  const buffsData = [
    {
      id: "traveler",
      name: "Путешественник.",
      img: "1.jpg",
      costs: { none: 27, bronze_1: 30, bronze_2: 33, bronze_3: 36, silver_1: 39, silver_2: 42, silver_3: 45, gold_1: 51, gold_2: 57, gold_3: 63, diamond_1: null, diamond_2: null, diamond_3: null }
    },
    {
      id: "exp_traveler",
      name: "Опытный путешественник.",
      img: "2.jpg",
      costs: { none: 45, bronze_1: 50, bronze_2: 55, bronze_3: 60, silver_1: 65, silver_2: 70, silver_3: 75, gold_1: 85, gold_2: 95, gold_3: 105, diamond_1: null, diamond_2: null, diamond_3: null }
    },
    {
      id: "seeker",
      name: "Искатель.",
      img: "3.jpg",
      costs: { none: 90, bronze_1: 100, bronze_2: 110, bronze_3: 120, silver_1: 130, silver_2: 140, silver_3: 150, gold_1: 170, gold_2: 190, gold_3: 210, diamond_1: null, diamond_2: null, diamond_3: null }
    },
    {
      id: "pathfinder",
      name: "Следопыт.",
      img: "4.jpg",
      costs: { none: 54, bronze_1: 60, bronze_2: 66, bronze_3: 72, silver_1: 78, silver_2: 84, silver_3: 90, gold_1: 102, gold_2: 114, gold_3: 126, diamond_1: null, diamond_2: null, diamond_3: null }
    },
    {
      id: "sage",
      name: "Мудрец.",
      img: "5.jpg",
      costs: { none: 90, bronze_1: 100, bronze_2: 110, bronze_3: 120, silver_1: 130, silver_2: 140, silver_3: 150, gold_1: 170, gold_2: 190, gold_3: 210, diamond_1: null, diamond_2: null, diamond_3: null }
    },
    {
      id: "exp_sage",
      name: "Опытный мудрец.",
      img: "6.jpg",
      costs: { none: 180, bronze_1: 200, bronze_2: 220, bronze_3: 240, silver_1: 260, silver_2: 280, silver_3: 300, gold_1: 340, gold_2: 380, gold_3: 420, diamond_1: null, diamond_2: null, diamond_3: null }
    }
  ];

  const ranksData = [
    { id: "none", stars: "", label: "Нет ранга.", starClass: "", isDiamond: false },
    { id: "bronze_1", stars: "★", label: "", starClass: "star-bronze", isDiamond: false },
    { id: "bronze_2", stars: "★★", label: "", starClass: "star-bronze", isDiamond: false },
    { id: "bronze_3", stars: "★★★", label: "", starClass: "star-bronze", isDiamond: false },
    { id: "silver_1", stars: "★", label: "", starClass: "star-silver", isDiamond: false },
    { id: "silver_2", stars: "★★", label: "", starClass: "star-silver", isDiamond: false },
    { id: "silver_3", stars: "★★★", label: "", starClass: "star-silver", isDiamond: false },
    { id: "gold_1", stars: "★", label: "", starClass: "star-gold", isDiamond: false },
    { id: "gold_2", stars: "★★", label: "", starClass: "star-gold", isDiamond: false },
    { id: "gold_3", stars: "★★★", label: "", starClass: "star-gold", isDiamond: false },
    { id: "diamond_1", stars: "★", label: "", starClass: "star-diamond", isDiamond: true },
    { id: "diamond_2", stars: "★★", label: "", starClass: "star-diamond", isDiamond: true },
    { id: "diamond_3", stars: "★★★", label: "", starClass: "star-diamond", isDiamond: true }
  ];
  const activeIds = new Set();
  let selectedRankId = null;

  const grid = document.getElementById("buffsGrid");
  const rankDropdown = document.getElementById("rankDropdown");
  const clanRankPanel = document.getElementById("clanRankPanel");
  const selectedRankDisplay = document.getElementById("selectedRankDisplay");
  const rankWarning = document.getElementById("rankWarning");
  const resultBox = document.getElementById("resultBox");
  const resultList = document.getElementById("resultList");
  const resultTotalBlock = document.getElementById("resultTotalBlock");
  const resultTotalPrices = document.getElementById("resultTotalPrices");
  const memberSplitBox = document.getElementById("memberSplitBox");
  const memberCountInput = document.getElementById("memberCountInput");
  const memberResultPrices = document.getElementById("memberResultPrices");

  function formatNumber(num) {
    return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  function declOfNum(number, one, few, many) {
    const n100 = Math.abs(number) % 100;
    const n10 = n100 % 10;
    if (n100 > 10 && n100 < 20) return many;
    if (n10 > 1 && n10 < 5) return few;
    if (n10 === 1) return one;
    return many;
  }

  function scrollToMemberSplit() {
    setTimeout(() => {
      memberSplitBox.scrollIntoView({ behavior: "smooth", block: "center" });
    }, 300);
  }

  function renderCards() {
    grid.innerHTML = "";
    buffsData.forEach((buff) => {
      const card = document.createElement("div");
      const isActive = activeIds.has(buff.id);
      card.className = "buff-card" + (isActive ? " active" : "");
      card.onclick = () => toggleBuff(buff.id);
      card.innerHTML = `<div class="status-badge">✓</div><img src="${buff.img}" alt="${buff.name}" />`;
      grid.appendChild(card);
    });
  }

  function formatRankHTML(rank) {
    if (!rank.stars) return rank.label;
    return `<span class="${rank.starClass}">${rank.stars}</span>`;
  }

  function renderRankOptions() {
    rankDropdown.innerHTML = "";
    ranksData.forEach((rank) => {
      const option = document.createElement("div");
      option.className = "rank-option" + (rank.id === selectedRankId ? " selected" : "");
      option.innerHTML = `<span>${formatRankHTML(rank)}</span>`;
      option.onclick = (e) => { e.stopPropagation(); selectRank(rank); };
      rankDropdown.appendChild(option);
    });
  }

  function selectRank(rank) {
    selectedRankId = rank.id;
    selectedRankDisplay.style.color = "";
    selectedRankDisplay.style.fontWeight = "";
    selectedRankDisplay.innerHTML = formatRankHTML(rank);
    if (rank.isDiamond) rankWarning.classList.add("visible");
    else rankWarning.classList.remove("visible");
    closeRankMenu();
    renderRankOptions();
    updateCalculation();
  }

  function updateDropdownDirection() {
    const rect = clanRankPanel.getBoundingClientRect();
    const spaceBelow = window.innerHeight - rect.bottom;
    const spaceAbove = rect.top;

    if (spaceBelow < 270 && spaceAbove > spaceBelow) {
      rankDropdown.classList.add("open-up");
    } else {
      rankDropdown.classList.remove("open-up");
    }
  }

  function toggleRankMenu(e) {
    e.stopPropagation();
    if (rankDropdown.classList.contains("open")) {
      closeRankMenu();
    } else {
      updateDropdownDirection();
      rankDropdown.classList.add("open");
      clanRankPanel.classList.add("open");

      const selectedOption = rankDropdown.querySelector(".rank-option.selected");
      if (selectedOption) {
        selectedOption.scrollIntoView({ block: "nearest" });
      }
    }
  }

  function closeRankMenu() {
    rankDropdown.classList.remove("open");
    clanRankPanel.classList.remove("open");
  }

  document.addEventListener("click", closeRankMenu);
  window.addEventListener("resize", () => {
    if (rankDropdown.classList.contains("open")) {
      updateDropdownDirection();
    }
  });

  function toggleBuff(id) {
    if (activeIds.has(id)) activeIds.delete(id);
    else activeIds.add(id);
    renderCards();
    updateCalculation();
  }

  function selectAllBuffs() {
    buffsData.forEach((b) => activeIds.add(b.id));
    renderCards();
    updateCalculation();
  }

  function resetBuffs() {
    activeIds.clear();
    renderCards();
    updateCalculation();
  }

  function updateCalculation() {
    if (activeIds.size === 0) {
      resultBox.classList.remove("visible");
      return;
    }

    resultBox.classList.add("visible");
    resultList.innerHTML = "";

    if (!selectedRankId) {
      resultList.innerHTML = `<div class="result-item" style="justify-content: center; color: var(--text-muted);">Для начала выбери ранг клана выше☝️</div>`;
      resultTotalBlock.style.display = "none";
      resultList.classList.add("single-item");
      memberResultPrices.innerHTML = `<span class="member-caps-value empty">—</span>`;
      return;
    }

    let totalTokens = 0;
    let hasUnknown = false;

    buffsData.forEach((buff) => {
      if (activeIds.has(buff.id)) {
        const tokens = buff.costs[selectedRankId];
        const item = document.createElement("div");
        item.className = "result-item";

        if (tokens === null || tokens === undefined) {
          hasUnknown = true;
          item.innerHTML = `<span class="result-item-name">${buff.name}</span><div class="result-item-prices"><span class="cost-unknown">-</span></div>`;
        } else {
          totalTokens += tokens;
          const caps = tokens * CAPS_PER_TOKEN;
          const tokenWord = declOfNum(tokens, "токен.", "токена.", "токенов.");
          const capsWord = declOfNum(caps, "крышка.", "крышки.", "крышек.");
          item.innerHTML = `<span class="result-item-name">${buff.name}</span><div class="result-item-prices"><span class="cost-tokens">${formatNumber(tokens)} ${tokenWord}</span><span class="cost-caps">${formatNumber(caps)} ${capsWord}</span></div>`;
        }
        resultList.appendChild(item);
      }
    });

    const totalCaps = totalTokens * CAPS_PER_TOKEN;

    if (activeIds.size === 1) {
      resultTotalBlock.style.display = "none";
      resultList.classList.add("single-item");
    } else {
      resultTotalBlock.style.display = "flex";
      resultList.classList.remove("single-item");

      if (hasUnknown) {
        resultTotalPrices.innerHTML = `<span class="cost-unknown">-</span>`;
      } else {
        const totalTokenWord = declOfNum(totalTokens, "токен.", "токена.", "токенов.");
        const totalCapsWord = declOfNum(totalCaps, "крышка.", "крышки.", "крышек.");
        resultTotalPrices.innerHTML = `<span class="total-tokens">${formatNumber(totalTokens)} ${totalTokenWord}</span><span class="total-caps">${formatNumber(totalCaps)} ${totalCapsWord}</span>`;
      }
    }

    const memberCount = parseInt(memberCountInput.value, 10);

    if (hasUnknown) {
      memberResultPrices.innerHTML = `<span class="cost-unknown">-</span>`;
    } else if (!memberCount || memberCount < 1) {
      memberResultPrices.innerHTML = `<span class="member-caps-value empty">—</span>`;
    } else {
      const tokensPerMember = Math.ceil(totalTokens / memberCount);
      const capsPerMember = tokensPerMember * CAPS_PER_TOKEN;
      const memberTokenWord = declOfNum(tokensPerMember, "токен.", "токена.", "токенов.");
      const memberCapsWord = declOfNum(capsPerMember, "крышка.", "крышки.", "крышек.");
      memberResultPrices.innerHTML = `
        <span class="member-tokens-value">(${formatNumber(tokensPerMember)} ${memberTokenWord})</span>
        <span class="member-caps-value">${formatNumber(capsPerMember)} ${memberCapsWord}</span>
      `;
    }
  }

  renderCards();
  renderRankOptions();
  updateCalculation();
</script>

</body>
</html>
